<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چالش فنی - نادین سافت</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 500px;
            border-top: 5px solid #0056b3;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        h1 {
            color: #0056b3;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
        }
        .intern-name {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #eef2f5;
            border-radius: 8px;
            font-weight: bold;
            color: #e44d26;
            border: 1px dashed #ccc;
        }
        .footer-text {
            font-size: 13px;
            color: #999;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚀</div>
        <h1>به چالش دواپس نادین سافت خوش آمدید</h1>
        <p>این صفحه نشان می‌دهد که کانتینر وب‌سرور شما با موفقیت اجرا شده و تنظیمات پایه به درستی انجام شده است.</p>
        
        <div class="intern-name">
            کارآموز عزیز: محمد مصطفی شایگان ثابت
        </div>

        <p class="footer-text">
            اگر این صفحه را در مرورگر خود می‌بینید، یعنی بخش اول تسک را با موفقیت پشت سر گذاشته‌اید. به مسیرتان ادامه دهید!
        </p>
    </div>
</body>
</html>
